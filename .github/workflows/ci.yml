name: CI and Docker image

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      image_version:
        description: Docker image version, independent of the npm package (for example 1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  IMAGE_NAME: cubesystems/server-audit

jobs:
  image:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test
        run: bash test/smoke.sh

      - name: Set image version
        if: github.event_name == 'workflow_dispatch'
        id: version
        env:
          IMAGE_VERSION: ${{ inputs.image_version }}
        run: |
          if [[ ! "$IMAGE_VERSION" =~ ^[0-9][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo 'Expected an image version such as 1.0 or 1.0.1' >&2
            exit 1
          fi
          printf 'image=%s:%s\n' "$IMAGE_NAME" "$IMAGE_VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: ${{ github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.version.outputs.image }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
